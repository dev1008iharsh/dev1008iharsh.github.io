<!-- =========================================
     Contact Section
========================================= -->

<section id="contact" class="section">

    <div class="contact-card">

        <!-- =========================================
             Left Content
        ========================================== -->

        <div class="contact-left">

            <!-- Availability Badge -->

            <div class="hero-badge">
                🚀 Available for Opportunities
            </div>

            <!-- Main Heading -->

            <h2>
                Let's Build
                <span>Amazing Apps</span>
            </h2>

            <!-- Description -->

            <p>
                Open for Senior iOS Engineering opportunities,
                architecture consulting,
                realtime systems,
                AI-powered mobile applications,
                and scalable product development.
            </p>

            <!-- Contact Links -->

            <div class="contact-links">

                <a href="mailto:dev.iharsh1008@gmail.com">
                    dev.iharsh1008@gmail.com
                </a>

                <a href="tel:+919662108047">
                    +91 9662108047
                </a>

            </div>

        </div>

        <!-- =========================================
             Contact Form
        ========================================== -->

        <!-- IMPORTANT:
             Keep this exact ID for mail.js
        -->

        <form
            id="contact-form"
            class="contact-form"
            autocomplete="off"
        >

            <!-- Name -->

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Your Name"
                required
            >

            <!-- Email -->

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Your Email"
                required
            >

            <!-- Subject -->

            <input
                type="text"
                id="subject"
                name="subject"
                placeholder="Subject"
                required
            >

            <!-- Message -->

            <textarea
                id="message"
                name="message"
                placeholder="Tell me about your project..."
                required
            ></textarea>

            <!-- Submit Button -->

            <button
                type="submit"
                class="primary-btn"
            >
                Send Message 🚀
            </button>

        </form>

    </div>

</section>

<!-- =========================================
     Mail Script
========================================= -->

<script src="js/mail.js"></script>
