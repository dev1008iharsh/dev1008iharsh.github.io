<!-- =========================================
     Contact Section
========================================== -->
<section id="contact" class="section">

    <div class="contact-card">

        <!-- =========================================
             Left Content
        ========================================== -->
        <div class="contact-left">

            <!-- Availability Badge -->
            <div class="hero-badge">
                🚀 Available for Opportunities
            </div>

            <!-- Main Heading -->
            <h2>
                Let's Build
                <span>Amazing Apps</span>
            </h2>

            <!-- Description -->
            <p>
                Open for Senior iOS Engineering opportunities,
                architecture consulting,
                realtime systems,
                AI-powered mobile applications
                and scalable product development.
            </p>

            <!-- Contact Links -->
            <div class="contact-links">

                <a href="mailto:dev.iharsh1008@gmail.com">
                    dev.iharsh1008@gmail.com
                </a>

                <a href="tel:+919662108047">
                    +91 9662108047
                </a>

            </div>

        </div>

        <!-- =========================================
             Contact Form
        ========================================== -->

        <!-- IMPORTANT:
             ID must match mail.js
        -->

        <form
            id="contact-form"
            class="contact-form"
        >

            <!-- Name -->

            <input
                type="text"
                id="name"
                placeholder="Your Name"
                required
            >

            <!-- Email -->

            <input
                type="email"
                id="email"
                placeholder="Your Email"
                required
            >

            <!-- Subject -->

            <input
                type="text"
                id="subject"
                placeholder="Subject"
                required
            >

            <!-- Message -->

            <textarea
                id="message"
                placeholder="Tell me about your project..."
                required
            ></textarea>

            <!-- Submit Button -->

            <button type="submit">
                Send Message
            </button>

        </form>

    </div>

</section>
