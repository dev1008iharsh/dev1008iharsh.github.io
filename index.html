<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Meta -->
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Harsh Darji • Senior iOS Engineer
    </title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/animations.css">

    <link rel="stylesheet" href="css/cursor.css">

    <link rel="stylesheet" href="css/modal.css">

    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

    <!-- =========================================
         Cursor
    ========================================== -->
    <div class="cursor-dot"></div>

    <div class="cursor-outline"></div>

    <!-- =========================================
         Background Effects
    ========================================== -->
    <div class="grid-overlay"></div>

    <div class="blur blur-one"></div>

    <div class="blur blur-two"></div>

    <!-- =========================================
         Components Containers
    ========================================== -->

    <div id="navbar-container"></div>

    <div id="hero-container"></div>

    <div id="about-container"></div>

    <div id="featured-container"></div>

    <div id="skills-container-wrapper">

        <section
            id="skills"
            class="section"
        >

            <div class="section-heading">

                <h2>
                    Technical <span>Arsenal</span>
                </h2>

                <p>
                    Core technologies and engineering expertise
                    powering scalable iOS applications.
                </p>

            </div>

            <!-- Dynamic Skills -->
            <div
                id="skills-container"
                class="skills-grid"
            ></div>

        </section>

    </div>

    <div id="contact-container"></div>

    <div id="footer-container"></div>

    <div id="modal-container"></div>

    <!-- =========================================
         Scripts
    ========================================== -->

    <!-- Core -->
    <script src="js/app.js"></script>

    <script src="js/typing.js"></script>

    <script src="js/cursor.js"></script>

    <script src="js/modal.js"></script>

    <script src="js/mail.js"></script>

    <!-- Dynamic Skills -->
    <script src="data/technicalArsenal.js"></script>

    <script src="js/renderSkills.js"></script>

    <!-- Components Loader -->
    <script src="js/loadComponents.js"></script>

</body>

</html>
