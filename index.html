<!-- =========================================================
FILE: index.html
Clean Modular Architecture
Uses reusable component files
========================================================= -->

<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================================
    META
    ====================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Harsh Darji • Senior iOS Engineer
    </title>

    <!-- =====================================================
    GOOGLE FONTS
    ====================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <!-- =====================================================
    CSS FILES
    ====================================================== -->

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/animations.css">

    <link rel="stylesheet" href="css/cursor.css">

    <link rel="stylesheet" href="css/modal.css">

    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

    <!-- =====================================================
    CUSTOM CURSOR
    ====================================================== -->

    <div class="cursor-dot"></div>

    <div class="cursor-outline"></div>

    <!-- =====================================================
    GLOBAL BACKGROUND EFFECTS
    ====================================================== -->

    <div class="grid-overlay"></div>

    <div class="blur blur-one"></div>

    <div class="blur blur-two"></div>

    <!-- =====================================================
    NAVBAR COMPONENT
    FILE:
    components/navbar.html
    ====================================================== -->

    <div id="navbar-container"></div>

    <!-- =====================================================
    HERO COMPONENT
    FILE:
    components/hero.html
    ====================================================== -->

    <div id="hero-container"></div>

    <!-- =====================================================
    ABOUT COMPONENT
    FILE:
    components/about.html
    ====================================================== -->

    <div id="about-container"></div>

    <!-- =====================================================
    FEATURED WORK COMPONENT
    FILE:
    components/featured-work.html
    ====================================================== -->

    <div id="featured-container"></div>

    <!-- =====================================================
    SKILLS SECTION
    Dynamic Rendering
    ====================================================== -->

    <section
        id="skills"
        class="section"
    >

        <div class="section-heading">

            <div class="hero-badge">
                🚀 Technical Expertise
            </div>

            <h2>
                Technical <span>Arsenal</span>
            </h2>

            <p>
                Core technologies and engineering expertise
                powering scalable iOS applications,
                realtime systems,
                AI integrations,
                clean architectures
                and production-grade development workflows.
            </p>

        </div>

        <!-- Dynamic Skills Rendering -->

        <div
            id="skills-container"
            class="skills-grid"
        ></div>

    </section>

    <!-- =====================================================
    CONTACT COMPONENT
    FILE:
    components/contact.html
    ====================================================== -->

    <div id="contact-container"></div>

    <!-- =====================================================
    FOOTER COMPONENT
    FILE:
    components/footer.html
    ====================================================== -->

    <div id="footer-container"></div>

    <!-- =====================================================
    MODAL COMPONENT
    FILE:
    components/modal.html
    ====================================================== -->

    <div id="modal-container"></div>

    <!-- =====================================================
    JAVASCRIPT FILES
    ====================================================== -->

    <!-- =====================================================
    CORE APP
    ====================================================== -->

    <script src="js/app.js"></script>

    <!-- =====================================================
    COMPONENT LOADER
    Loads external reusable HTML components
    ====================================================== -->

    <script src="js/loadComponents.js"></script>

    <!-- =====================================================
    HERO TYPING EFFECT
    ====================================================== -->

    <script src="js/typing.js"></script>

    <!-- =====================================================
    CUSTOM CURSOR
    ONLY FOR INDEX PAGE
    ====================================================== -->

    <script src="js/cursor.js"></script>

    <!-- =====================================================
    CONTACT FORM MAIL LOGIC
    ====================================================== -->

    <script src="js/mail.js"></script>

    <!-- =====================================================
    IMAGE MODAL
    ====================================================== -->

    <script src="js/modal.js"></script>

    <!-- =====================================================
    TECHNICAL SKILLS DATA
    ====================================================== -->

    <script src="data/technicalArsenal.js"></script>

    <!-- =====================================================
    SKILLS RENDERER
    ====================================================== -->

    <script src="js/renderSkills.js"></script>

</body>

</html>
